services:

  app:

    build:

      context: .

      dockerfile: docker/php/Dockerfile

    container_name: mavkora_app

    restart: unless-stopped

    working_dir: /var/www

    volumes:

      - ./:/var/www

    tty: true

    stdin_open: true

    environment:

      APP_ENV: local

      PHP_IDE_CONFIG: serverName=Mavkora

    healthcheck:

      test: [ "CMD", "php", "-v" ]

      interval: 20s

      timeout: 5s

      retries: 3

    depends_on:

      mysql:

        condition: service_healthy

      redis:

        condition: service_healthy

    networks:

      - mavkora

  nginx:

    image: nginx:1.28-alpine

    container_name: mavkora_nginx

    restart: unless-stopped

    ports:
      - "8000:80"

    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - mavkora

  mysql:

    image: mysql:8.4

    container_name: mavkora_mysql

    restart: unless-stopped

    ports:
      - "3306:3306"

    environment:

      MYSQL_DATABASE: mavkora

      MYSQL_ROOT_PASSWORD: root

      MYSQL_USER: mavkora

      MYSQL_PASSWORD: secret

    volumes:

      - mysql_data:/var/lib/mysql

      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf

    healthcheck:

      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]

      interval: 10s

      timeout: 5s

      retries: 10

    networks:
      - mavkora

  redis:

    image: redis:7-alpine

    container_name: mavkora_redis

    command: redis-server /usr/local/etc/redis/redis.conf

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf

    healthcheck:

      test: [ "CMD", "redis-cli", "ping" ]

      interval: 10s

      timeout: 5s

      retries: 10

    networks:
      - mavkora

  node:

    image: node:22

    container_name: mavkora_node

    restart: unless-stopped

    working_dir: /var/www

    volumes:
      - ./:/var/www

    command: sh -c "if [ ! -d node_modules ]; then npm install; fi && npm run dev -- --host"

    ports:
      - "5173:5173"

    networks:
      - mavkora

  phpmyadmin:

    image: phpmyadmin/phpmyadmin

    container_name: mavkora_phpmyadmin

    restart: unless-stopped

    environment:

      PMA_HOST: mysql

      PMA_PORT: 3306

    ports:
      - "8080:80"

    depends_on:
      - mysql

    networks:
      - mavkora

  mailpit:

    image: axllent/mailpit

    container_name: mavkora_mailpit

    restart: unless-stopped

    ports:

      - "1025:1025"

      - "8025:8025"

    networks:
      - mavkora

  # Orquestador del chatbot de WhatsApp.
  # Recibe el webhook de Meta, le pregunta a Laravel qué responder y envía la
  # respuesta de vuelta por la Cloud API. Al estar en la red 'mavkora' puede
  # llamar a Laravel como http://nginx/api/bot/... sin salir a internet.
  n8n:

    # Se usa Docker Hub y no el registro propio de n8n (docker.n8n.io) porque
    # ese dominio no resuelve en todas las redes y tumba el build entero.
    image: n8nio/n8n:latest

    container_name: mavkora_n8n

    restart: unless-stopped

    ports:
      - "5678:5678"

    environment:

      N8N_HOST: ${N8N_HOST:-localhost}

      N8N_PORT: 5678

      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}

      # URL pública que Meta usará para entregar los mensajes. En local es la
      # que entregue el túnel (ngrok/cloudflared); en producción, tu dominio.
      # Si queda mal, n8n registra rutas de webhook que Meta no puede alcanzar.
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}

      GENERIC_TIMEZONE: America/Bogota

      TZ: America/Bogota

      # Sin esta clave fija, n8n genera una nueva en cada arranque y las
      # credenciales guardadas quedan imposibles de descifrar.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-cambia-esta-clave-de-cifrado}

      N8N_DIAGNOSTICS_ENABLED: "false"

      N8N_RUNNERS_ENABLED: "true"

    volumes:
      - n8n_data:/home/node/.n8n
      # Los workflows versionados del repositorio, para importarlos desde la UI.
      - ./docker/n8n:/workflows:ro

    depends_on:
      - nginx

    networks:
      - mavkora

volumes:

  mysql_data:

  n8n_data:

networks:

  mavkora:
